<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MACI - Panel de Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
  <style>
    body { background-color: #000; color: #fff; font-family: Inter, system-ui, sans-serif; }
    .field { background: #000; border: 1px solid rgba(255,255,255,.12); border-radius: .5rem; padding: .5rem .75rem; width: 100%; font-size: .85rem; }
    .field:focus { outline: none; border-color: #FF4444; }
    .lbl { display: block; font-size: .6rem; text-transform: uppercase; letter-spacing: .15em; color: rgba(255,255,255,.5); margin-bottom: .25rem; font-weight: 700; }
    .btn { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: .4rem .8rem; border-radius: 9999px; transition: all .2s; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="min-h-screen selection:bg-red-500 selection:text-white pb-20 p-8">
  <div class="max-w-5xl mx-auto" x-data="adminPanel()" x-init="cargar()" x-cloak>
    <header class="flex flex-wrap gap-4 justify-between items-center mb-12 border-b border-white/10 pb-6 sticky top-0 bg-black/90 backdrop-blur z-10 pt-2">
      <div>
        <h1 class="text-3xl font-black uppercase text-red-500 tracking-tighter">MACI <span class="text-white">Admin</span></h1>
        <p class="text-xs text-white/40 mt-1">Edita src/data/*.json · con <code>npm run dev</code> abierto los cambios se ven al instante.</p>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-xs" :class="mensajeError ? 'text-red-400' : 'text-green-400'" x-text="mensaje"></span>
        <button @click="guardar()" class="bg-red-500 hover:bg-white hover:text-black text-white px-8 py-3 rounded-full font-bold uppercase tracking-widest transition-all">Guardar cambios</button>
      </div>
    </header>

    <div x-show="cargando" class="text-center py-20 text-white/50 animate-pulse">Cargando datos…</div>

    <div x-show="!cargando" class="space-y-12">
      <!-- Discos -->
      <section class="bg-white/5 rounded-2xl p-8 border border-white/10">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-2xl font-black uppercase tracking-tight">Discos <span class="text-white/30" x-text="'(' + albums.length + ')'"></span></h2>
          <button class="btn bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white" @click="nuevoDisco()">+ Añadir disco</button>
        </div>
        <p class="text-xs text-white/40 mb-6">El orden de la lista es el orden del carrusel.</p>

        <template x-for="(a, i) in albums" :key="a._key">
          <div class="bg-black border border-white/10 rounded-xl p-6 mb-6">
            <div class="flex gap-6 flex-col md:flex-row">
              <div class="w-full md:w-40 shrink-0 space-y-2">
                <img :src="a.cover ? '/files/image/' + encodeURIComponent(a.cover) : ''" class="w-40 h-40 object-cover rounded-lg border border-white/10 bg-white/5">
                <select class="field" x-model="a.cover">
                  <template x-for="img in images"><option :value="img" x-text="img" :selected="img === a.cover"></option></template>
                </select>
                <label class="btn block text-center cursor-pointer bg-white/10 hover:bg-white/20">Subir portada
                  <input type="file" accept="image/jpeg,image/png,image/webp" class="hidden" @change="subir($event, 'image', a, 'cover')">
                </label>
              </div>

              <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><span class="lbl">Título</span><input class="field" x-model="a.title"></div>
                <div class="grid grid-cols-2 gap-2">
                  <div><span class="lbl">ID</span><input class="field" x-model="a.id"></div>
                  <div><span class="lbl">Duración preview (s)</span><input class="field" type="number" min="1" x-model.number="a.duration"></div>
                </div>
                <div><span class="lbl">Etiqueta</span>
                  <select class="field" x-model="a.badge">
                    <option :value="null" :selected="a.badge === null">Ninguna</option>
                    <option value="new" :selected="a.badge === 'new'">Nuevo lanzamiento</option>
                    <option value="playing" :selected="a.badge === 'playing'">Reproduciendo</option>
                  </select>
                </div>
                <div><span class="lbl">Año (opcional)</span><input class="field" :value="a.year ?? ''" @input="a.year = $event.target.value || null"></div>
                <div><span class="lbl">Subtítulo ES</span><input class="field" x-model="a.kicker.es"></div>
                <div><span class="lbl">Subtítulo EN</span><input class="field" x-model="a.kicker.en"></div>
                <div><span class="lbl">Descripción ES</span><input class="field" :value="a.description?.es ?? ''" @input="setDesc(a, 'es', $event.target.value)"></div>
                <div><span class="lbl">Descripción EN</span><input class="field" :value="a.description?.en ?? ''" @input="setDesc(a, 'en', $event.target.value)"></div>
                <div class="md:col-span-2"><span class="lbl">Palabras clave (línea pequeña)</span><input class="field" :value="a.tags ?? ''" @input="a.tags = $event.target.value || null"></div>
                <div class="md:col-span-2"><span class="lbl">Enlace de Spotify</span><input class="field" x-model="a.spotify"></div>
                <div class="md:col-span-2"><span class="lbl">Texto accesible del botón de Spotify</span><input class="field" x-model="a.spotifyLabel"></div>
                <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-[1fr_auto] gap-2 items-end">
                  <div><span class="lbl">Audio de preview</span>
                    <select class="field" x-model="a.audio">
                      <template x-for="au in audios"><option :value="'/music-preview/' + au" x-text="au" :selected="a.audio === '/music-preview/' + au"></option></template>
                    </select>
                  </div>
                  <label class="btn text-center cursor-pointer bg-white/10 hover:bg-white/20">Subir MP3
                    <input type="file" accept="audio/mpeg" class="hidden" @change="subir($event, 'audio', a, 'audio')">
                  </label>
                </div>
                <div class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-white/10 pt-4">
                  <div><span class="lbl">Cuenta atrás: fecha de lanzamiento</span>
                    <input class="field" type="datetime-local" :value="a.countdown?.date?.slice(0, 16) ?? ''" @input="setCountdown(a, 'date', $event.target.value ? $event.target.value + ':00' : '')"></div>
                  <div><span class="lbl">Cuenta atrás: texto</span>
                    <input class="field" placeholder="LANZAMIENTO EN · 12 JUN" :value="a.countdown?.label ?? ''" @input="setCountdown(a, 'label', $event.target.value)"></div>
                </div>
                <div class="md:col-span-2 flex flex-wrap gap-6 text-xs text-white/70">
                  <label class="flex items-center gap-2"><input type="checkbox" x-model="a.uppercaseTitle"> Título en mayúsculas</label>
                  <label class="flex items-center gap-2"><input type="checkbox" x-model="a.compactKicker"> Subtítulo compacto en móvil</label>
                </div>
              </div>
            </div>
            <div class="flex gap-2 justify-end mt-4">
              <button class="btn bg-white/10 hover:bg-white/20" :disabled="i === 0" @click="mover(albums, i, -1)">↑</button>
              <button class="btn bg-white/10 hover:bg-white/20" :disabled="i === albums.length - 1" @click="mover(albums, i, 1)">↓</button>
              <button class="btn bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white" @click="if (confirm('¿Eliminar ' + a.title + '?')) albums.splice(i, 1)">Eliminar</button>
            </div>
          </div>
        </template>
      </section>

      <!-- Plataformas -->
      <section class="bg-white/5 rounded-2xl p-8 border border-white/10">
        <div class="flex justify-between items-center mb-8">
          <h2 class="text-2xl font-black uppercase tracking-tight">Plataformas</h2>
          <button class="btn bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white" @click="platforms.push({ name: '', logo: '/images/platforms/' })">+ Añadir</button>
        </div>
        <p class="text-xs text-white/40 mb-6">Logos en public/images/platforms/. "Invertir" es para logos negros (se ven blancos).</p>
        <template x-for="(p, i) in platforms" :key="i">
          <div class="grid grid-cols-1 md:grid-cols-[3rem_1fr_2fr_auto_auto_auto] gap-3 items-center mb-3">
            <img :src="p.logo" class="w-10 h-10 object-contain bg-white/10 rounded p-1">
            <input class="field" placeholder="Nombre" x-model="p.name">
            <input class="field" placeholder="/images/platforms/logo.svg" x-model="p.logo">
            <select class="field" :value="p.scale || ''" @change="p.scale = $event.target.value || undefined">
              <option value="">Tamaño normal</option>
              <option value="scale-110">110%</option>
              <option value="scale-125">125%</option>
              <option value="scale-150">150%</option>
            </select>
            <label class="flex items-center gap-2 text-xs text-white/70"><input type="checkbox" x-model="p.isDark"> Invertir</label>
            <div class="flex gap-1">
              <button class="btn bg-white/10 hover:bg-white/20" @click="mover(platforms, i, -1)">↑</button>
              <button class="btn bg-white/10 hover:bg-white/20" @click="mover(platforms, i, 1)">↓</button>
              <button class="btn bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white" @click="platforms.splice(i, 1)">✕</button>
            </div>
          </div>
        </template>
      </section>
    </div>
  </div>

  <script>
    function adminPanel() {
      let keySeq = 0;
      return {
        cargando: true,
        mensaje: '',
        mensajeError: false,
        albums: [],
        platforms: [],
        images: [],
        audios: [],

        async cargar() {
          const res = await fetch('/api/content');
          const data = await res.json();
          this.albums = data.albums.map((a) => ({ ...a, _key: ++keySeq }));
          this.platforms = data.platforms;
          this.images = data.images;
          this.audios = data.audios;
          this.cargando = false;
        },

        avisar(texto, error = false) {
          this.mensaje = texto;
          this.mensajeError = error;
          clearTimeout(this._t);
          this._t = setTimeout(() => (this.mensaje = ''), 5000);
        },

        nuevoDisco() {
          const ids = this.albums.map((a) => Number(a.id)).filter((n) => !Number.isNaN(n));
          this.albums.unshift({
            _key: ++keySeq,
            id: String((ids.length ? Math.max(...ids) : 0) + 1),
            title: 'Nuevo disco',
            uppercaseTitle: true,
            cover: this.images[0] || '',
            coverAlt: '',
            labelAlt: '',
            audio: this.audios[0] ? '/music-preview/' + this.audios[0] : '',
            duration: 30,
            badge: 'new',
            kicker: { es: 'Single', en: 'Single' },
            year: String(new Date().getFullYear()),
            description: null,
            tags: null,
            countdown: null,
            spotify: '',
            spotifyLabel: '',
          });
        },

        setDesc(a, lang, value) {
          a.description = { es: '', en: '', ...(a.description || {}), [lang]: value };
          if (!a.description.es && !a.description.en) a.description = null;
        },

        setCountdown(a, field, value) {
          a.countdown = { date: '', label: '', ...(a.countdown || {}), [field]: value };
          if (!a.countdown.date) a.countdown = null;
        },

        mover(list, i, dir) {
          const j = i + dir;
          if (j < 0 || j >= list.length) return;
          [list[i], list[j]] = [list[j], list[i]];
        },

        async subir(event, kind, target, field) {
          const file = event.target.files[0];
          if (!file) return;
          this.avisar('Subiendo ' + file.name + '…');
          const res = await fetch('/api/upload', {
            method: 'POST',
            headers: { 'X-File-Kind': kind, 'X-File-Name': encodeURIComponent(file.name) },
            body: file,
          });
          const data = await res.json();
          if (!res.ok) return this.avisar(data.error, true);
          if (kind === 'image') {
            if (!this.images.includes(data.name)) this.images = [...this.images, data.name].sort();
          } else if (!this.audios.includes(data.name)) {
            this.audios = [...this.audios, data.name].sort();
          }
          target[field] = data.url;
          this.avisar('Archivo subido: ' + data.name);
        },

        async guardar() {
          const albums = this.albums.map(({ _key, ...a }) => ({
            ...a,
            coverAlt: a.coverAlt || `Portada de ${a.title}`,
            spotifyLabel: a.spotifyLabel || `Escuchar ${a.title} en Spotify`,
          }));
          const res = await fetch('/api/content', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ albums, platforms: this.platforms }),
          });
          const data = await res.json();
          if (!res.ok) return this.avisar(data.error, true);
          this.avisar('Guardado ✓');
        },
      };
    }
  </script>
</body>
</html>
